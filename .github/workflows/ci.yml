name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/preview/package-lock.json
            apps/vscode/package-lock.json
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Install preview dependencies
        working-directory: apps/preview
        run: npm ci
      - name: Install Chromium
        working-directory: apps/preview
        run: npx playwright install --with-deps chromium
      - name: Preview typecheck and unit tests
        working-directory: apps/preview
        run: npm run typecheck && npm test
      - name: Build preview and notices
        working-directory: apps/preview
        run: npm run build
      - name: Browser acceptance
        working-directory: apps/preview
        run: npm run test:e2e
      - name: Install VS Code extension dependencies
        working-directory: apps/vscode
        run: npm ci
      - name: VS Code extension and installed VSIX acceptance
        working-directory: apps/vscode
        run: npm run typecheck && npm run test:unit && xvfb-run --auto-servernum npm run test:vsix
