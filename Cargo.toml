[workspace]
members = ["crates/kontur-core", "crates/kontur-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
pest = "=2.9.5"
pest_derive = "=2.8.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
